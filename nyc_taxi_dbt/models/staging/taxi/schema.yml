version: 2

sources:
  - name: raw_staging
    description: Raw staging schema containing ingested NYC taxi data.
    tables:
      - name: raw_trips
        description: Raw trip records.
        columns:
          - name: VendorID
            tests:
              - not_null

models:
  - name: stg_taxi_trips
    description: >
      Standardized NYC Taxi trip data prepared for
      downstream analytical transformations.
    columns:
      - name: vendor_id
        description: "Identifier of the taxi technology provider."
        tests:
          - not_null
      - name: pickup_datetime
        description: "Date and time when the trip started."
        tests:
          - not_null
      - name: dropoff_datetime
        description: "Date and time when the trip ended."
        tests:
          - not_null
      - name: pickup_location_id
        description: "Identifier of the pickup taxi zone."
      - name: dropoff_location_id
        description: "Identifier of the dropoff taxi zone."
      - name: passenger_count
        description: "Number of passengers recorded for the trip."
      - name: trip_distance
        description: "Distance traveled during the trip."
      - name: fare_amount
        description: "Base fare amount for the trip."
      - name: total_amount
        description: "Total amount charged for the trip."